interface:
  display_name: "SnapGene DNA Design"
  short_description: "Local DNA construction, annotated files, and evidence records."
  default_prompt: "Use $snapgene-dna-design following SKILL.md. Start from the requested result and supplied material: determine reuse, preparation, or new design. Clarify only information that changes the necessary action; retain existing authorization. Execute supported Recipes or Pipeline operations, inspect actual files and check scope, then deliver the main conclusion and artifacts. Evidence Trace records the work alongside it; organize the report after the design result is established."

policy:
  allow_implicit_invocation: true
