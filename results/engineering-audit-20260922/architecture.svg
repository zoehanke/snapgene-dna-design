<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="title desc">
<title id="title">DNA computation and Evidence Trace boundaries</title><desc id="desc">The host selects a route. Recipes and pipelines perform preparation; specialized tasks model sequence changes. Files pass scoped checks before delivery. Trace records observed results and submitted organization without changing DNA.</desc>
