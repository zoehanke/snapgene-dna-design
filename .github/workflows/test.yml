name: CI Test Suite

on:
  push:
    branches: [ main, master, "recovery/*", "release/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: snapgene-dna-design/requirements.txt

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r snapgene-dna-design/requirements.txt

      - name: Run Full Unit Test Suite
        env:
          SNAPGENE_RUN_PRIMER3: "1"
        run: |
          python -X utf8 -B tools/run_test_suite.py

      - name: Run CLI Entrypoints Smoke Test
        working-directory: snapgene-dna-design
        run: |
          python -X utf8 -B scripts/check_env.py --json
          python scripts/inspect_plasmid.py fixtures/synthetic/pSynthetic-GFP.gb
          python scripts/run_recipe.py --recipe recipe_protein_tagging --params-json fixtures/synthetic/tagging_params.json --out-dir ./build/ci_recipe
