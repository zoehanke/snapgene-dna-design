name: Official source verification

on:
  push:
    branches: ["codex/crispr-skill-fixes-20261012"]
    paths:
      - .github/workflows/official-source.yml
      - tools/check_official_source.py

permissions:
  contents: read

env:
  OFFICIAL_SHA: 42590dbe27757fc377c6c256e161964a76dfb7ec
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  SNAPGENE_RUN_PRIMER3: "1"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  test-official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch exact official source
        run: |
          git -c core.autocrlf=false clone --no-checkout https://gitlab.igem.org/2026/software/tianjin/igem-tianjin2026.git official-source
          git -C official-source -c core.autocrlf=false checkout --detach "$OFFICIAL_SHA"
          python -X utf8 -B controller/tools/check_official_source.py --source-dir official-source --commit "$OFFICIAL_SHA" --report-json ci-reports/source-readback.json
          printf 'Tested official source: %s\nController commit: %s\n' "$OFFICIAL_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned official dependencies
        working-directory: official-source
        run: python -m pip install --requirement snapgene-dna-design/requirements-tested.txt
      - name: Run complete disjoint source suite
        working-directory: official-source
        run: python -X utf8 -B tools/run_test_suite.py --shard-count 8 --shard-index ${{ matrix.shard }} --report-json ../ci-reports/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-shard-${{ matrix.shard }}
          path: ci-reports/*.json
